<!DOCTYPE html>
<html lang="en-US">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Accesible counter component with audio feeback, keyboard arrow navigation and ARIA attributes.">
        <link rel="shortcut icon" href="./src/favicon.svg" type="image/x-icon">
        <link rel="stylesheet" href="./src/style.css">
        <title>Counter-app</title>
    </head>

    <body>
        <main>
            <span class="text-white" data-span="counter" aria-live="polite" aria-disabled="true" aria-label="Counter">0</span>
            <ul data-container="button" aria-label="Counter controls">
                <li>
                    <button class="text-white" data-button="increment-counter" type="button">Increment counter</button>
                </li>
                <li>
                    <button class="text-white" data-button="decrement-counter" type="button">Decrement counter</button>
                </li>
                <li>
                    <button class="text-white" data-button="reset-counter" type="button">Reset counter</button>
                </li>
            </ul>
        </main>
        <footer>
            <small>© 2025 Guilherme Aires. Licensed under the MIT License.</small>
        </footer>
        <script src="app.js"></script>
    </body>

</html>
